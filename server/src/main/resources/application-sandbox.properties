# Easebuzz Sandbox Profile
# This profile ensures ALL API calls go to test environment

# Server
server.port=8081
server.servlet.context-path=/api/v2

# Database (same as dev)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kbook_saas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:?Set DB_PASSWORD env var}

# Easebuzz Sandbox (Test Environment)
easebuzz.payment-base-url=${EASEBUZZ_PAYMENT_BASE_URL:https://testpay.easebuzz.in}
easebuzz.dashboard-base-url=${EASEBUZZ_DASHBOARD_BASE_URL:https://testdashboard.easebuzz.in}
easebuzz.merchant-key=${EASEBUZZ_MERCHANT_KEY:?Set EASEBUZZ_MERCHANT_KEY env var}
easebuzz.salt=${EASEBUZZ_SALT:?Set EASEBUZZ_SALT env var}
# Set return/notify URLs via env vars for your dev tunnel
easebuzz.return-url=${EASEBUZZ_RETURN_URL:?Set EASEBUZZ_RETURN_URL env var}
easebuzz.notify-url=${EASEBUZZ_NOTIFY_URL:?Set EASEBUZZ_NOTIFY_URL env var}
easebuzz.webhook-url=${EASEBUZZ_WEBHOOK_URL:?Set EASEBUZZ_WEBHOOK_URL env var}

# Easebuzz WIRE Platform
easebuzz.wire-base-url=https://testdashboard.easebuzz.in
easebuzz.wire-api-key=

# JWT
jwt.secret=${JWT_SECRET:?Set JWT_SECRET env var (min 32 bytes random)}
jwt.expiration.ms=15552000000
jwt.terminal.expiration.ms=15552000000

# Payment crypto (for Easebuzz hash)
payment.crypto.secret=${PAYMENT_CRYPTO_SECRET:?Set PAYMENT_CRYPTO_SECRET env var}

# Logging
logging.level.com.khanabook=DEBUG
logging.level.org.springframework.web=DEBUG

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# FSSAI Lookup API
fssai.lookup.url=${FSSAI_LOOKUP_URL:https://iadv.in/tracker/dist/lic-info.php?lic_num=}

