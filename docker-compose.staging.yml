# KhanaBook STAGING stack — fully isolated from production.
# Run with an explicit project name so nothing collides with the prod stack:
#   docker compose -p kbook-staging --env-file ops/.env.staging -f docker-compose.staging.yml up -d
#
# Isolation vs production:
#   project      kbook-staging        (prod: kbookiadvcloud)
#   db name      kbook_staging        (prod: kbook_saas)
#   volume       pgdata-staging       (prod: pgdata)
#   app port     127.0.0.1:8091       (prod: 127.0.0.1:8081)
#   cdn dir      /var/www/staging-cdn (prod: /var/www/cdn.kbook.iadv.cloud)
#   private dir  /var/www/staging-private (prod: /var/www/kbook-private)
#   Easebuzz     SANDBOX only
# PostgreSQL is NEVER published to a host port. App binds only to 127.0.0.1.

services:
  postgres:
    image: postgres:16-alpine
    container_name: kbook-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata-staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - staging-backend

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kbook-staging-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8081
      # DB points at the STAGING postgres service on the staging network — never prod.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      WHATSAPP_META_ACCESS_TOKEN: ${WHATSAPP_META_ACCESS_TOKEN:-}
      WHATSAPP_META_PHONE_NUMBER_ID: ${WHATSAPP_META_PHONE_NUMBER_ID:-}
      WHATSAPP_META_OTP_TEMPLATE_NAME: ${WHATSAPP_META_OTP_TEMPLATE_NAME:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://staging.kbook.iadv.cloud}
      PAYMENT_CRYPTO_SECRET: ${PAYMENT_CRYPTO_SECRET}
      APP_BASE_URL: ${APP_BASE_URL:-https://staging.kbook.iadv.cloud}
      # Easebuzz SANDBOX only — defaults force the test endpoints.
      EASEBUZZ_MERCHANT_KEY: ${EASEBUZZ_MERCHANT_KEY:-}
      EASEBUZZ_SALT: ${EASEBUZZ_SALT:-}
      EASEBUZZ_PAYMENT_BASE_URL: ${EASEBUZZ_PAYMENT_BASE_URL:-https://testpay.easebuzz.in}
      EASEBUZZ_DASHBOARD_BASE_URL: ${EASEBUZZ_DASHBOARD_BASE_URL:-https://testdashboard.easebuzz.in}
      EASEBUZZ_RETURN_URL: ${EASEBUZZ_RETURN_URL:-https://staging.kbook.iadv.cloud/api/v1/payments/easebuzz/return}
      EASEBUZZ_NOTIFY_URL: ${EASEBUZZ_NOTIFY_URL:-https://staging.kbook.iadv.cloud/api/v1/payments/easebuzz/webhook}
      EASEBUZZ_WEBHOOK_URL: ${EASEBUZZ_WEBHOOK_URL:-https://staging.kbook.iadv.cloud/api/v1/payments/easebuzz/webhook}
      EASEBUZZ_WIRE_BASE_URL: ${EASEBUZZ_WIRE_BASE_URL:-https://testdashboard.easebuzz.in}
      EASEBUZZ_WIRE_API_KEY: ${EASEBUZZ_WIRE_API_KEY:-}
      # Staging CDN + private storage — separate host dirs, never prod paths.
      CDN_BASE_PATH: ${CDN_BASE_PATH:-/var/www/staging-cdn/restaurants/}
      CDN_URL_PREFIX: ${CDN_URL_PREFIX:-https://staging.kbook.iadv.cloud/cdn/}
      CDN_TMP_PATH: ${CDN_TMP_PATH:-/var/www/staging-cdn/tmp/}
      PRIVATE_DOCS_BASE_PATH: ${PRIVATE_DOCS_BASE_PATH:-/var/www/staging-private/documents/}
      CWEBP_BIN: ${CWEBP_BIN:-cwebp}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-true}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-true}
      # Notifications disabled by default in staging (no prod provider creds).
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
    command: ["sh", "-c", "sleep 3 && java -XX:+UseContainerSupport -XX:MaxRAMPercentage=50.0 -Djava.security.egd=file:/dev/./urandom -jar app.jar"]
    volumes:
      - /var/www/staging-cdn:/var/www/staging-cdn
      - /var/www/staging-private:/var/www/staging-private
    ports:
      - "127.0.0.1:${SERVER_PORT:-8091}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - staging-backend

networks:
  staging-backend:
    driver: bridge
    name: kbook-staging-backend

volumes:
  pgdata-staging:
    name: pgdata-staging
