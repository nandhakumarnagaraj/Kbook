  '/api/v1/contacts/{contact_id}/':
    get:
      summary: Retrieve Contact by ID
      description: Retrieve details of a contact by contact_id.
      operationId: get-api-v1-contacts-contact_id
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: 86b9923ef53c49fbd2589eade1c4797a98fbb1f1975f8aa2107b901dd793ecec8bf56daf08b7431a92062d9b51ba6afbb1b886fd6f2b7fce28929a4a49a35f4e
          description: 'SHA-512 hash of the string in the format “{key}|{id}|{salt}”'
          required: true
        - name: WIRE-API-KEY
          in: header
          schema:
            type: string
          example: 1Z1234567X
          description: WIRE-API-KEY provided by Easebuzz
          required: false
        - schema:
            type: string
          in: path
          name: contact_id
          description: Contact ID generated at the time of creating the contact
          required: true
        - schema:
            type: string
          in: query
          name: key
          description: WIRE-API-KEY provided by Easebuzz
          required: true
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      contact:
                        type: object
                        properties:
                          id:
                            type: string
                          status:
                            type: string
                          created_at:
                            type: string
