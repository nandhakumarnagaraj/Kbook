  id: 6a2346d5c896f
info:
  title: Contacts
  version: 1.0.9
  description: 'APIs to perform create, update and retrieve actions on Contacts'
  contact:
    name: Easebuzz Support
    email: support@easebuzz.in
    url: 'https://easebuzz.in/contact/'
  termsOfService: 'https://easebuzz.in/terms/'
servers:
  - url: 'https://wire.easebuzz.in'
    description: Prod
paths:
  /api/v1/contacts/:
    post:
      description: 'Use this API to create a new contact. A contact can be someone with contact information like email or phone number. **Eg:** customers, payees, receivers, etc.'
      summary: Create Contact
      operationId: create-api-v1-contact
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                example-1:
                  key: 1Z1234567X
                  name: Akash
                  email: demo.test@easebuzz.in
                  phone: '9999999999'
              properties:
                key:
                  type: string
                  example: 1Z1234567X
                name:
                  type: string
                  example: Test Easebuzz
                email:
                  type: string
                  example: test@easebuzz.in
                phone:
                  type: string
                  example: '9999999999'
              required:
                - key
                - name
            examples:
              Sample Request:
                value:
                  key: 1Z1234567X
                  name: Akash
                  email: demo.test@easebuzz.in
                  phone: '9999999999'
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: fde43e6bb8c43b00d6e8a61377e642b2cbf97d0e6659f424a816838c63b76ef9f351576a07cfdc921468bad488976950dcf6d8ba521363323c7b0817b284c260
          required: true
          description: 'SHA-512 hash of string in the format “{key}|{name}|{email}|{phone}|{salt}"'
        - name: WIRE-API-KEY
          in: header
          schema:
            type: string
          example: 1Z1234567X
          description: WIRE-API-KEY provided by Easebuzz
          required: false
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    success: true
                    data:
                      contact:
                        id: cont977ad8af40d595d1afb051402604
                        status: Active
                        created_at: '2022-09-17T12:30:58.246827+05:30'
                        deleted_at: null
                        name: Test contact
                        email: demo.wEandM@easebuzz.in
                        phone: '9999999321'
                        created_by: null
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      contact:
                        type: object
                        properties:
                          id:
                            type: string
                            example: cont977ad8af40d595d1afb051402604
                          status:
                            type: string
                            example: Active
                          created_at:
                            type: string
                            example: '2022-09-17T12:30:58.246827+05:30'
                          deleted_at:
                            example: null
                            nullable: true
                          name:
                            type: string
                            example: Test contact
                          email:
                            type: string
                            example: test@easebuzz.in
                          phone:
                            type: string
                            example: '9999999999'
                          created_by:
                            example: null
                            nullable: true
                      '':
                        type: string
              examples:
                Successful Response:
                  value:
                    success: true
                    data:
                      contact:
                        id: cont941f20a64b70b4137b7161ae97a2
                        status: Active
                        created_at: '2022-01-31T11:59:47.744122+05:30'
                        deleted_at: null
                        name: Test EaseBuzz
                        email: demo.test@easebuzz.in
                        phone: '9999999999'
                        created_by: null
                Hash Mismatch:
                  value:
                    success: false
                    status: false
                    message: Hash mismatch.
                    insta_enabled: false
                    wire_allowed: true
                    wire_activated: true
                    easebuzz_allowed: true
                Type (Value) Mismatch:
                  value:
                    success: false
                    message: Invalid value for parameter 'phone'
                Empty or Invalid Key:
                  value:
                    success: false
                    status: false
                    message: Invalid key.
                    insta_enabled: false
                    wire_allowed: true
                    wire_activated: true
                    easebuzz_allowed: true
                No Authorization Key:
                  value:
                    success: false
                    status: false
                    message: Authentication Failed.
                    insta_enabled: false
                    wire_allowed: true
                    wire_activated: true
                    easebuzz_allowed: true
    get:
      summary: Retrieve All Contacts
      description: Retrieve a paginated list of all the available contacts.
      operationId: get-api-v1-contacts-all
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: 135628583a58b0675d236cc711c226109519402c35e2bedb67b5c31f651df0ee93769c3e7724ade598e6128b4c8b463ba3b78c284fd9c859ae089553e668a41d
          required: true
          description: 'SHA-512 hash of string in the format “{key}|{salt}"'
        - name: WIRE-API-KEY
          in: header
          schema:
            type: string
          example: 1Z1234567X
          description: API key provided by Easebuzz
          required: false
        - name: key
          in: query
          schema:
            type: string
          example: 1Z1234567X
          description: Same as the WIRE-API-Key provided by Easebuzz
          required: true
        - name: current
          in: query
          schema:
            type: integer
          example: 5
          description: Page no. of the set of contacts
          required: false
        - schema:
            type: integer
            example: 10
          in: query
          name: pageSize
          description: 'The number of contacts per page. If not sent, by default 10 contacts are returned.'
          required: false
        - schema:
            type: string
          in: query
          name: phone
          description: Phone no. of the contact to search
        - schema:
            type: string
          in: query
          name: email
          description: Email of the contact to search
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      count:
                        type: integer
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            status:
                              type: string
                            created_at:
                              type: string
                            deleted_at:
                              type: 'null'
                            name:
                              type: string
                            email:
                              type:
                                - 'null'
                                - string
                            phone:
                              type:
                                - 'null'
                                - string
                            created_by:
                              type: 'null'
                      total_pages:
                        type: integer
                      page_size:
                        type: integer
