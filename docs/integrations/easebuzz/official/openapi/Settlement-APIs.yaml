      description: |
        Easebuzz automatically creates payouts of your available account balance based on the transaction date. To check your settlement via the API, perform a create payout request call, providing the payout date. We can check the settlement transactions and refund charges via Payout API. Query the payout of a particular date.

        > **Note:** It is critical to configure [**webhooks**](https://docs.easebuzz.in/docs/payment-gateway/587zy3v064so6-what-are-webhooks) as this will allow the Easebuzz system to 'push' data to your system whenever any event occurs, ensuring that both systems are always in sync.

        **Hash sequence:** 
        ```
        merchant_key||payout_date|salt
        ```
