                  payout_date: 26-09-2022
              required:
                - merchant_key
                - hash
              properties:
                merchant_email:
                  type: string
                  description: Registered email ID of the customer.
                merchant_key:
                  type: string
                  description: Unique Merchant Key provided by Easebuzz for your merchant account.
                hash:
                  type: string
                  description: |
                    This is sha512 encrypted string. And hash sequence is mentioned above
                    Hash sequence: `merchant_key|start_date|end_date|salt`
                payout_date:
                  type: object
                  description: "Parameter contains two keys `start_date` and `end_date`, `end_date` must be greater than or equal to `start_date` (Date Format - DD-MM-YYYY).\r\n"
                  required:
                    - start_date
                    - end_date
                  properties:
                    start_date:
                      type: string
                      x-stoplight:
                        id: 54b5pqx9ni8rc
                    end_date:
                      type: string
                      x-stoplight:
                        id: hgpxmop90c18e
                submerchant_id:
                  type: string
                  description: Pass the `submerchant_id` if the payout UTR (bank transaction ID) number is required for the submerchant (Aggregator Model).
                token:
                  type: string
                  x-stoplight:
                    id: i8ls7d0vd8gpf
                  description: "A new key “token” is passed into payload instead of “hash\".  It is generated via Easebuzz TOKEN Authentication API. The token will be valid for 1 hour.\r\n> Note : Hash is not required to pass through payload if token is present in it.\r\n"
