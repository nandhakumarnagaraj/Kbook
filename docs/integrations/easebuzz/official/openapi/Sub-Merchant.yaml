paths:
  /api/v1/merchants/create/:
    post:
      summary: Create Sub-merchant
      operationId: get-api-v1-merchants-create
      parameters:
        - type: string
          in: header
          name: Authorization
          description: 'SHA-512 hash of a string in the format “{key}|{name}|{email}|{phone}|{salt}” '
          required: true
        - type: string
          in: header
          name: WIRE-API-KEY
          description: WIRE-API-KEY provided by Easebuzz
        - in: body
          name: body
          schema:
            type: object
            x-examples:
              Example 1:
                key: 1A8376051B
                name: Neo Banking Support
                name_on_bank: Neo Banking Support
                email: neobankingsupport@easebuzz.in
                phone: '9999999999'
                business_name: Easebuzz Neobanking
                state: Maharashtra
                nature_of_business: Customer Support
                business_address: 'Easebuzz Pvt Ltd, Block B, Social Street, Opp Vivanta Hotel, Pune'
                bank_name: HDFC Bank
                bank_branch: hinjewadi
                account_number: '12345678901'
                account_ifsc: HDFC0000001
                category_code: '5968'
                pan_number: AAAAA8888A
                business_type_code: '42'
                address: 'Easebuzz Pvt Ltd, Block B, Social Street, Opp Vivanta Hotel, Pune'
                city: Pune
                pincode: '411057'
                entity_type: '14'
                gstin: ''
                primary_vpa: ''
            required:
              - key
              - name
              - name_on_bank
              - email
              - phone
              - business_name
              - state
              - nature_of_business
              - business_address
              - bank_name
              - bank_branch
              - account_number
              - account_ifsc
              - category_code
              - pan_number
              - business_type_code
              - address
              - city
              - pincode
              - entity_type
            properties:
              key:
                type: string
              name:
                type: string
              name_on_bank:
                type: string
              email:
                type: string
              phone:
                type: string
              business_name:
                type: string
              state:
                type: string
                description: 'The state in which the business is registered. A list of all the states is provided [here](docs/2.4.1-Sub-Merchants-Codes-List.md) '
              nature_of_business:
                type: string
              business_address:
                type: string
              bank_name:
                type: string
              bank_branch:
                type: string
              account_number:
                type: string
              account_ifsc:
                type: string
              category_code:
                type: string
                description: 'A list of all the category codes is provided [here](docs/2.4.1-Sub-Merchants-Codes-List.md)'
              pan_number:
                type: string
              business_type_code:
                type: string
                description: 'A list of all the business type codes is provided [here](docs/2.4.1-Sub-Merchants-Codes-List.md)'
              address:
                type: string
              city:
                type: string
              pincode:
                type: string
              entity_type:
                type: string
                description: 'A list of all the entity type codes is provided [here](docs/2.4.1-Sub-Merchants-Codes-List.md)'
              gstin:
                type: string
              primary_vpa:
                type: string
          x-examples:
            Sample Request:
              key: string
              name: string
              name_on_bank: string
              email: string
              phone: string
              business_name: string
              state: string
              nature_of_business: string
              business_address: string
              bank_name: string
              bank_branch: string
              account_number: string
              account_ifsc: string
              category_code: string
              pan_number: string
              business_type_code: string
              address: string
              city: string
              pincode: string
              entity_type: string
              gstin: string
              primary_vpa: string
              webhook_url: string
          description: ''
      description: |-
        Use this API to create a sub-merchant under the parent merchant's account. A sub-merchant gets their individual login credentials and must complete their KYC individually.

        *   Generate SHA-512 hash  sequence in the format specified and add it in the headers under the key "authorization".
        *   Hash sequence - "{key}|{name}|{email}|{phone}|{salt}"

        For a list of all the eligible values, please refer [**Sub-merchant Creation Codes List**](docs/2.4.1-Sub-Merchants-Codes-List.md)
