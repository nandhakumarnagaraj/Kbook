  /api/v1/beneficiaries/retrieve/:
    get:
      summary: Retrieve Beneficiary by Account Details
      description: Retrieve details of a beneficiary using the beneficiary's account details or VPA handle.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
          example: 85405c6ad2aee92992938669a3730ab8cd67b4a6bc3fa506f1dc5e2277901eefcc88497110efd9ce8a8f24eaef89014e7a85fb4fe61e82ed4687aded5a032c16
