          example: 1Z1234567X
          description: WIRE-API-KEY provided by Easebuzz.
          required: true
        - name: beneficiary_type
          in: query
          schema:
            type: string
            enum:
              - bank_account
              - upi
          example: upi
          description: Type of the beneficiary's account
          required: true
        - name: upi_handle
          in: query
          schema:
            type: string
          example: demo@oksbi
          description: UPI Handle of the beneficiary is mandatory if beneficiary_type is upi
        - schema:
            type: string
          in: query
          name: account_number
          example: 1234567890
          description: Account Number of the beneficiary is mandatory if beneficiary_type is bank_account
        - schema:
            type: string
          in: query
          name: ifsc
          example: HDFC0000001
          description: IFSC Code of the beneficiary is mandatory if beneficiary_type is bank_account
