  title: Beneficiary Accounts
  version: 1.0.9
  contact:
    name: Easebuzz Support
    url: 'https://easebuzz.in/contact/'
    email: support@easebuzz.in
  description: A beneficiary holds account-related information such as bank account details or UPI handle of the payee to whom the funds should be disbursed. A contact can have multiple beneficiaries.
  termsOfService: 'https://easebuzz.in/terms/'
