      summary: Add Beneficiary Account
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                example-1:
                  key: 1Z1234567X
                  contact_id: cont941f20a64b70b4137b7161ae97a2
                  beneficiary_type: bank_account
                  beneficiary_name: DEMO TEST
                  account_number: '0123456999'
                  ifsc: HDFC0000001
                  upi_handle: demo@okhdfcbank
              properties:
                key:
                  type: string
                contact_id:
                  type: string
                beneficiary_type:
                  type: string
                  enum:
                    - bank_account
                    - upi
                beneficiary_name:
                  type: string
                  maxLength: 150
                  minLength: 1
                account_number:
                  type: string
                  description: The bank account number of the beneficiary. Mandatory if the "beneficiary_type" is "bank_account".
                  minLength: 5
                ifsc:
                  type: string
                  description: The IFSC code of the bank account of the beneficiary. Mandatory if the "beneficiary_type" is "bank_account".
                upi_handle:
                  type: string
                  description: The upi handle of the beneficiary. Mandatory if the "beneficiary_type" is "upi".
              required:
                - key
                - contact_id
                - beneficiary_type
                - beneficiary_name
            examples:
              Create beneficiary with bank details:
                value:
                  key: 1Z1234567X
                  contact_id: cont941f20a64b70b4137b7161ae97a2
                  beneficiary_type: bank_account
                  beneficiary_name: DEMO TEST
                  account_number: '0123456999'
                  ifsc: HDFC0000001
              Create beneficiary with VPA address:
                value:
                  key: 1Z1234567X
                  contact_id: cont9da436ef46cea89bc913767c539b
                  beneficiary_type: upi
                  beneficiary_name: Dev D
                  upi_handle: demo@okhdfcbank
