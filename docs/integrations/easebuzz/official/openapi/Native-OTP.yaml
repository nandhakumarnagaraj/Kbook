info:
  title: Native OTP APIs
  version: 1.0.0
  description: "## Native OTP APIs \r\n---\r\n\r\n\r\nGenerate an access_key using Easebuzz **[Initiate Payment API](../apis/Initiate-Transaction-APIs.yaml)**. With this API, provide `request_flow` parameter with value `SEAMLESS` in order to generate an `access_key` for seamless\r\ntransaction.\r\n\r\n\r\n## Initiate Seamless Payment\r\n---\r\nTo complete the payment with card payment mode trigger the Seamless payment API.\r\nPass the browser details as per the request payload below and `request_mode` = `S2S` for Easebuzz to\r\ncheck if the card is enabled for Native OTP flow.\r\n\r\nRefer **[Request and Response APIs](https://docs.easebuzz.in/docs/payment-gateway/k3ho860cy66zh-seamless-integration-merchant-hosted)** to Initiate Seamless Payment API.\r\n\r\n\r\n## Card Encryption Guidelines\r\n---\r\n- In case of payment mode being Debit Card or Credit Card, parameters carrying card details (card_number, card_holder_name, card_cvv, card_expiry_date) need to be encrypted.\r\n- Encryption should be done using AES-256 in CBC mode.\r\n- For AES-256 KEY, create an SHA-256 hash of your EASEBUZZ MERCHANT KEY and use the first 32 bytes of it.\r\n- For AES-256 IV, create an SHA-256 hash of your EASEBUZZ SALT and use the first 16 bytes of it.\r\n- Padding size of encrypted data should be maintained with a padding length of multiples of 16.\r\n\r\n> **Note:** Special characters allowed in UDF field : _#@-=+&]$\r\n\r\n> **Note:** ACS URL is dynamic, therefore construct an auto-submit form as dynamic, retrieve payload data as a form input field, request_method as form method, and redirection_url as action URL.\r\n\r\n---\r\n\r\n"
servers:
  - description: Sandbox URL
    url: 'https://testdashboard.easebuzz.in'
  - url: 'https://dashboard.easebuzz.in'
    description: Production URL
