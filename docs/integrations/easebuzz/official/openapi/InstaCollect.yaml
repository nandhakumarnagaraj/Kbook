      description: |-
        Get a paginated list of all InstaCollect transactions. InstaCollect transactions contain the details about the payments attempted by payers.

        *   Generate SHA-512 hash  sequence in the format specified and add it in the headers under the key "authorization".
        *   Hash sequence - "{key}|{salt}".

        > **NOTE:** Retrieve Transactions List v1 API will be deprecated after sometime. 
    parameters: []
  /api/v2/insta-collect/transactions/:
    get:
      tags:
        - Transactions
      summary: Retrieve Transactions List v2
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
            example: 2e011baf0fadd5b16996e875bd341b33b97dbf2ff6a6f2c8125cf2daafdcf8da5d645335ba62c8e45fb85cbdb462eeb0803f0f393432863bd85fbf52df57399a
          example: 3a3c8ee714ff1f9260bdfa332030b4518ab019b6f4500322dbfe8cfe8dad6618b2e846b94bc9539b77c424999e97c3c709659224a714f6559bdbd053423b778a
          description: 'SHA-512 hash of string in the format "{key}|{salt}"'
          required: true
        - name: key
          in: query
          schema:
            type: string
            example: 1Z1234567X
          example: 1Z1234567X
          description: WIRE-API-KEY provided by Easebuzz. The key must be provided in the query.
          required: true
        - schema:
            type: string
            example: '2'
          in: query
          name: current
          description: Page no. of set of Transactions
        - schema:
            type: string
            example: '10'
            maxLength: 100
          in: query
          name: pageSize
          description: Number of Transaction Records per page
          allowReserved: false
        - schema:
            type: string
          in: header
          description: WIRE-API-KEY provided by Easebuzz
          name: WIRE-API-KEY
        - schema:
            type: string
            example: '2023-02-17'
          in: query
          name: created_at
          description: Transactions can be retrieved for a particular date. created_at_start and created_at_end should not be passed if created_at is passed
        - schema:
            type: string
            example: '2023-02-01'
          in: query
          name: created_at_start
          description: Created At Start Date. Retrieve the transaction for a date range. created_at should not be passed. Data can be retrieved for the last 3 months.
        - schema:
            type: string
            example: '2023-02-28'
          in: query
          name: created_at_end
          description: Created At End Date. Retrieve the transaction for a date range. created_at should not be passed. Data can be retrieved for the last 3 months.
        - schema:
            type: string
            example: cvaee4d26c6a442897d372168ca8eb26
          in: query
          name: virtual_account_id
          description: Retrieve transactions aganist a particular Custom Virtual Account ID
        - schema:
            type: string
            example: orderb7b0f7f417e8725b1702c38a121
          in: query
          name: order_id
          description: Retrieve transactions aganist a particular Smart Oders.
        - schema:
            type: string
            enum:
              - unsettled
              - received
              - refunded
              - partially_refunded
              - failure
              - pending
              - time_out
              - uncaptured
          in: query
          name: status
          description: Transactions can be retrieved wit respect to transaction status.
        - schema:
            type: string
            example: '306560716703'
          in: query
          name: unique_transaction_reference
          description: Transaction can be retrieved with respect to 12 digit Bank Reference Number
