paths:
  /merchant/v1/submerchant/create/:
    post:
      summary: Create Sub-Merchant API
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                example-1:
                  merchant_details:
                    merchant_key: CJFX28Z1BG
                    hash: 4cb46e8c0aec6e9c093cb12709763f4f07f25cecf34ca416b31dd0d1e3291a8be89312271e81ff8bd59d79ad786b2ff2e6f3e08cb481e8f3825733b2d22a1e80
                  submerchant_details:
                    sub_merchant_name: Sagar
                    sub_merchant_email: sagar.sawant@easebuzz.in
                    sub_merchant_phone: '8805596828'
                    sub_merchant_name_in_bank: Sagar
                    sub_merchant_account_number: '123456987'
                    sub_merchant_bank_name: HDFC
                    sub_merchant_branch_name: PUNE
                    sub_merchant_ifsc_code: HDFC0000794
              properties:
                merchant_details:
                  type: object
                  required:
                    - merchant_key
                    - hash
                  properties:
                    merchant_key:
                      type: string
                      description: Unique Merchant Key provided by Easebuzz for your merchant account.
                    hash:
                      type: string
                      description: |-
                        This is sha512 encrypted string. And hash sequence is mentioned above.The value should be in lower case.
                        Hash sequence: key|submerchant_email|submerchant_phone|salt
                submerchant_details:
                  type: object
                  required:
                    - sub_merchant_name
                    - sub_merchant_email
                    - sub_merchant_phone
                    - sub_merchant_name_in_bank
                    - sub_merchant_account_number
                    - sub_merchant_bank_name
                    - sub_merchant_branch_name
                    - sub_merchant_ifsc_code
                    - sub_merchant_password
                    - sub_merchant_confirm_password
                  properties:
                    sub_merchant_name:
                      type: string
                      description: Name of Sub-Merchant's firm/entity.
                    sub_merchant_email:
                      type: string
                      description: Official email ID of Sub-Merchant.
                    sub_merchant_phone:
                      type: string
                      description: Sub-Merchant mobile number.
                    sub_merchant_name_in_bank:
                      type: string
                      description: Name of Sub-Merchant's as per bank.
                    sub_merchant_account_number:
                      type: string
                      description: Account number for Sub-Merchant.
                    sub_merchant_bank_name:
                      type: string
                      description: Name of the Sub-Merchant bank. E.g. SBI
                    sub_merchant_branch_name:
                      type: string
                      description: Name of the Sub-Merchant bank branch. E.g. Dhanori Branch.
                    sub_merchant_ifsc_code:
                      type: string
                      description: IFSC code of given bank name.
                    sub_merchant_password:
                      type: string
                      description: Password for the Sub-merchant account
                    sub_merchant_confirm_password:
                      type: string
                      description: Confirm password for the Sub-merchant account
              required:
                - merchant_details
                - submerchant_details
            examples:
              example-1:
                value:
                  merchant_details:
                    merchant_key: RXXXXX5ZA
                    hash: 99f59e29b2b68304acc0a0e5095294a7ab2e83e1dde44eafba56d59f4b1ab29ca398f766f64f7eeae5fdba351cb9043acf5c1f1f89f8d22308436893364059b7
                  submerchant_details:
