  /submerchant/v1/generate_kyc_access_key:
    post:
      summary: Generate Sub-Merchant KYC Access Key API
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                example-1:
                  merchant_key: R7EZ9C05ZA
                  hash: eac95ef5209ce85cec9a1083db93fc85545d39cf75bed56e37fa4052c34f1652fe767452c302756a4b3c2de1f9698dc1e2a17f93dce2304a181c0197b134ce64
                  sub_merchant_id: S360DILA
              required:
                - merchant_key
                - sub_merchant_id
                - name
                - email
                - phone
                - hash
              properties:
                merchant_key:
                  type: string
                  description: Unique Merchant Key provided by Easebuzz for your merchant account.
                sub_merchant_id:
                  type: string
                  description: Unique ID for Submerchant created by EaseBuzz.
                name:
                  type: string
                  x-stoplight:
                    id: t26fbwti6bra9
                  description: Name of Sub-Merchant's firm/entity.
                email:
                  type: string
                  x-stoplight:
                    id: kawioh98rla5o
                  description: Official email ID of Sub-Merchant.
                phone:
                  type: string
                  x-stoplight:
                    id: pq50t3iisbjyb
                  description: Sub-Merchant mobile number.
                hash:
                  type: string
                  description: |-
                    This is sha512 encrypted string. And hash sequence is mentioned above.The value should be in lower case.
                    Hash sequence: **merchant_key|sub_merchant_id|name|email|phone|salt**
            examples:
              example-1:
                value:
                  merchant_key: RXXXXXXXA
                  sub_merchant_id: SXXXABCD
                  name: Cristiano
                  email: ronaldo@gmail.com
                  phone: 9XXXXXXXXX
                  hash: 0e37bbdd89e9022f5e766110ac028f80b8858c60ef1c8fd7dd658dd6d978a1e3daba81e43bcf3be960b4b0cdf6421edc9c337220334f109b3d2e94bdd6528e09
        description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  kyc_dashboard_url:
                    type: string
                x-examples:
                  example-1:
                    status: true
                    kyc_dashboard_url: 'https://kyc.easebuzz.in/cfa4294068d3102a7fa95d44e04fa2887b3550b0?access_key=7410782217806'
              examples:
                success:
                  value:
                    status: true
                    kyc_dashboard_url: 'https://kyc.easebuzz.in/cfa4294068d3102a7fa95d44e04fa2887b3550b0?access_key=741078221780630'
      description: |-
        This API allows merchants to generate the access key for redirecting to the KYC portal wherein the documents can be uploaded.

        > **Note:** It is critical to configure [**webhooks**](https://docs.easebuzz.in/docs/payment-gateway/587zy3v064so6-what-are-webhooks) as this will allow the Easebuzz system to 'push' data to your system whenever any event occurs, ensuring that both systems are always in sync.

        **Hash sequence:** 

        ```
        merchant_key|sub_merchant_id|name|email|phone|salt
        ```
    parameters: []
