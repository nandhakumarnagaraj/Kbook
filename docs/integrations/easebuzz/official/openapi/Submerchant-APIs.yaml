                    sub_merchant_branch_name: Bankura
                    sub_merchant_ifsc_code: ICIXXXXX25
                    sub_merchant_password: XXXXXXXXX
                    sub_merchant_confirm_password: XXXXXXXXXX
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status: true
                    submerchant:
                      email: xxx@xxxx.xxx
                      account_number: xxxxxxxxxxxx
                      submerchant_id: XXXXXXXXXX
                      name: XXXXXX XXXXX
                      mobile_number: xxxxxxxxxxx
                    submerchant_id: xxxxxxxxxx
                    error: XX
                    error_desc: XX
                properties:
                  status:
                    type: boolean
                  submerchant:
                    type: object
                    properties:
                      email:
                        type: string
                      account_number:
                        type: string
                      name:
                        type: string
                      mobile_number:
                        type: string
                  submerchant_id:
                    type: string
                  error:
                    type: string
                  error_desc:
                    type: string
              examples:
                Success Response:
                  value:
                    status: true
                    submerchant_id: S645900003
                    submerchant:
                      name: Rajesh K
                      email: rajesh+1@easebuzz.in
                      mobile_number: '9575000000'
                      account_number: '420000000000051'
                    error: NA
                    error_desc: NA
                    kyc_details:
                      status: true
                      message: Token generated successfully
                      kyc_dashboard_url: 'https://kyc.easebuzz.in/2585e6a7f4b0fa76cfa57cbac6ac7a50e877cc85f07411f613827ba6c08d8e18f3983e45ec16f931f7c2824c090dba882ca57c4e63687e0bb0cd2cb?access_key=8261098598360322501015409046266988131222920591346272913748894475240968916647964997543265481323382965'
                Failure Response:
                  value:
                    status: false
                    submerchant_id: ''
                    submerchant:
                      name: Rajesh K
                      email: rajesh+1@easebuzz.in
                      mobile_number: '9575000000'
                      account_number: '420000000000051'
                    error: Duplicate email
                    error_desc: Submerchant with same email already exist
      description: |-
        Once a sub-merchant profile is done, the following API setup is required. This API is to Create / Update a sub-merchant.

        > **Note:** It is critical to configure [**webhooks**](https://docs.easebuzz.in/docs/payment-gateway/587zy3v064so6-what-are-webhooks) as this will allow the Easebuzz system to 'push' data to your system whenever any event occurs, ensuring that both systems are always in sync.

        **Hash sequence:**
        ```
        key|submerchant_email|submerchant_phone|salt
        ```
