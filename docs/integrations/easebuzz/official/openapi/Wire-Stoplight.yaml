                key:
                  type: string
                virtual_account_number:
                  type: string
                beneficiary_code:
                  type: string
                unique_request_number:
                  type: string
                  minLength: 5
                  maxLength: 32
                  example: ARCVZ234567
                  description: Alphanumeric string which is the unique indentifier for a transfer.
                payment_mode:
                  type: string
                  enum:
                    - IMPS
                    - NEFT
                    - RTGS
                    - UPI
                  example: IMPS
                amount:
                  type: number
                  example: '1.00'
                  format: float
                scheduled_for:
                  type: string
                  format: date
                  example: '2022-09-30'
                narration:
                  type: string
                udf1:
                  type: string
                  maxLength: 255
                udf2:
                  type: string
                  maxLength: 255
                udf3:
                  type: string
                  maxLength: 255
                udf4:
                  type: string
                  maxLength: 255
                udf5:
                  type: string
                  maxLength: 255
              required:
                - key
                - beneficiary_code
                - unique_request_number
                - payment_mode
                - amount
            examples:
              Request Body:
                value:
                  key: 1Z1234567X
                  virtual_account_number: 100001000000xxxxx
                  beneficiary_code: bene89e604fa46ada71221b76be79a72
                  unique_request_number: '234567'
                  payment_mode: IMPS
                  amount: 1
                  narration: Testinitiatetransfer
                  udf1: Initiatetransfertest
