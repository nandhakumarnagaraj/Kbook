          required: true
        - schema:
            type: string
            example: 1Z1234567X
          in: query
          name: key
          required: true
          description: Same as the WIRE-API-Key provided by Easebuzz
        - schema:
            type: string
          in: header
          name: WIRE-API-KEY
          description: KEY provided by Easebuzz
