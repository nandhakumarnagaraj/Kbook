  /api/v1/merchants/funding_accounts/:
    post:
      summary: Add Funding Account
      operationId: post-api-v1-merchants-funding_accounts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                x-examples:
                  Example 1:
                    success: true
                    data:
                      message: Account Added Successfully.
              examples:
                Sample Response:
                  value:
                    success: true
                    data:
                      message: Account Added Successfully.
      parameters:
        - schema:
            type: string
          in: header
          name: Authorization
          required: true
          description: 'The checksum which needs to be generated. SHA-512 hash of string in the format "{key}|{account_Number}|{ifsc}|{salt}"'
        - schema:
            type: string
          in: header
          name: Content-Type
          description: multipart/form-data
          required: true
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                key:
                  type: string
                name_on_bank:
                  type: string
                bank_name:
                  type: string
                account_number:
                  type: string
                account_ifsc:
                  type: string
                bank_branch:
                  type: string
                cancelled_cheque:
                  type: string
                  description: 'Attach file (extention should be .jpg, .jpeg, .png, .pdf) below 2 MB'
                other_document:
                  type: string
                  description: 'Attach file (extention should be .jpg, .jpeg, .png, .pdf) below 2 MB'
              required:
                - key
                - name_on_bank
                - bank_name
                - account_number
                - account_ifsc
                - bank_branch
                - cancelled_cheque
      tags:
        - Accounts
      description: Use this API to add a source/funding account for adding funds to your virtual account for payouts. The accounts added using this API wil be verified and white-listed by Easebuzz.
