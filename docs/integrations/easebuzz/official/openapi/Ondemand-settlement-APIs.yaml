openapi: 3.0.0
x-stoplight:
  id: 643f40bc5eae3
info:
  title: On-demand Settlement APIs
  version: 1.0.0
servers:
  - url: 'https://testdashboard.easebuzz.in'
    description: Sandbox URL
  - url: 'https://dashboard.easebuzz.in'
    description: Production URL
paths:
  /settlements/v1/ondemand/initiate/:
    post:
      summary: Initiate API
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  key: XXXX - (M)
                  merchant_email: abcd@gmail.com - (M)
                  merchant_batch_id: <Unique ID to be provided by merchant> - (M)
                  description: <Description provided by merchant> -- (O)
                  transactions:
                    - easebuzz_id: EXXXXXXX1 - (M)
                      merchant_txn_id: yyyy - (M)
                      amount: <Total debited amount> - (M)
                      hash: key|easebuzz_id|merchant_txn|amount|salt – (M) SHA512/SHA256
                    - easebuzz_id: EXXXXXXX2 - (M)
                      merchant_txn_id: yyyy - (M)
                      amount: <Total debited amount> - (M)
                      hash: key|easebuzz_id|merchant_txn|amount|salt – (M) SHA512/SHA256
                    - easebuzz_id: EXXXXXXX3 - (M)
                      merchant_txn_id: yyyy - (M)
                      amount: <Total debited amount> - (M)
                      hash: key|easebuzz_id|merchant_txn|amount|salt – (M) SHA512/SHA256
              required:
                - key
                - merchant_email
                - merchant_batch_id
                - transactions
              properties:
                key:
                  type: string
                  description: Unique Merchant Key provided by Easebuzz for your merchant account.
                merchant_email:
                  type: string
                  description: Registered email of the merchant.
                merchant_batch_id:
                  type: string
                  description: Unique batch id entered by the merchant for creating batch of transactions at the time of hitting On Demand Initiate Settlement API.
                description:
                  type: string
                  description: Optional field which the merchant can utilise.
                transactions:
                  type: array
                  description: |-
                    A list of individual transaction details sent by the merchant for On-Demand Settlements.

                    Inside the transactions list, individual transaction details, each with their unique hash with the hash_string as:
                    ```key|easebuzz_id|merchant_txn_id|amount|salt```
                  items:
                    type: object
                    required:
                      - easebuzz_id
                      - merchant_txn_id
                      - amount
                      - hash
                    properties:
                      easebuzz_id:
                        type: string
                        description: Unique Easebuzz ID generated by Easebuzz
                      merchant_txn_id:
                        type: string
                        description: Unique Transaction Id set on Merchant’s End for every transaction.
                      amount:
                        type: string
                        description: 'The payment amount of the particular transaction. Note: Please type-cast the amount to float type.'
                      hash:
                        type: string
                        description: |-
                          Inside the transactions list, every transaction details object would contain a hash with the hash_string as:
                          ```key|easebuzz_id|merchant_txn_id|amount|salt```
            examples:
              Example:
                value:
                  key: XXXXXXXX
                  merchant_email: samxxxxxxx@gmail.com
                  merchant_batch_id: XXXXXXXXXXXX
                  description: This is a description
                  transactions:
                    - easebuzz_id: E24XXXXXXXXX1
                      merchant_txn_id: XXXXXXXXX
                      amount: '12345.0'
                      hash: XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                    - easebuzz_id: E24XXXXXXXXXX2
                      merchant_txn_id: XXXXXXXXXXXX
                      amount: '3456.0'
                      hash: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                    - easebuzz_id: E24XXXXXXXX3
                      merchant_txn_id: XXXXXXXXXXX
                      amount: '5678.0'
                      hash: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  batch_status:
                    type: string
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        easebuzz_id:
                          type: string
                        status:
                          type: string
                        error:
                          type: string
                x-examples:
                  Example 1:
                    status: true
                    batch_status: pending
                    transactions:
                      - easebuzz_id: EXXXXXXX1 - (M)
                        status: accepted
                        error: ''
                      - easebuzz_id: EXXXXXXX2 - (M)
                        status: accepted
                        error: ''
                      - easebuzz_id: EXXXXXXX3 - (M)
                        status: failure
                        error: Hash Mismatch
              examples:
                Example:
                  value:
                    status: true
                    batch_status: pending
                    transactions:
                      - easebuzz_id: E24XXXXXXXXX1
                        status: accepted
                        error: ''
                      - easebuzz_id: E24XXXXXXXXXX2
                        status: accepted
                        error: ''
                      - easebuzz_id: E24XXXXXXXXXX3
                        status: failure
                        error: Hash Mismatch
      x-stoplight:
        id: q3zhxyn3v4xbv
      description: |-
        Streamline your settlement process using our API, granting merchants the ability to selectively choose and promptly settle transactions. Experience financial flexibility with on-demand settlements delivered as quickly as the following day (T+1).

        Eliminate the need to wait for entire batches; simply pick and process the transactions that are most important to you!

        **Hash sequence:**  ```key|easebuzz_id|merchant_txn_id|amount|salt```
  /settlements/v1/ondemand/status/:
    post:
      summary: Status API
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                Example 1:
                  key: 0MJMYHYF75
                  merchant_email: payment_vendor.admin@moneyview.in
                  merchant_batch_id: batch_ff8080818caaff9e018cab9f76247a67
                  hash: ffb9847e20a8b27d0a572e550ec55dc0d6fd66117c1c97a3b16adb5e696705751d4811e60ba12c83f8a244da9c37dc078f096358e3013a665fdc52e0c2b6e147
              required:
                - key
                - merchant_email
                - merchant_batch_id
                - hash
              properties:
                key:
                  type: string
                  description: Unique Merchant Key provided by Easebuzz for your merchant account.
                merchant_email:
                  type: string
                  description: Registered email of the merchant.
                merchant_batch_id:
                  type: string
                  description: Unique Batch ID to be entered by the merchant for these batch of transactions.
                hash:
                  type: string
                  description: 'This is sha512/sha256 encrypted string. The hash sequence is mentioned above. Hash sequence: ```key|merchant_email|merchant_batch_id|salt```'
            examples:
              Example:
                value:
                  key: 4DXXXXXXXX
                  merchant_email: samxxxxxxxxx@gmail.com
                  merchant_batch_id: XXXXXXXXXXXXXXXX
                  hash: ffb9847e20a8b27d0a572e550exxxxxxxx52e0c2b6e147
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: boolean
                  batch_status:
                    type: string
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        easebuzz_id:
                          type: string
                        error_message:
                          type: string
                        settlement_status:
                          type: string
                        requested_at:
                          type: string
                        txn_settlement_amount:
                          type: integer
                        settlement_info:
                          type: object
                          properties:
                            settlement_id:
                              type: string
                            utr_number:
                              type: string
                            total_settlement_amount:
                              type: string
                            settled_at:
                              type: string
                x-examples:
                  Example 1:
                    status: true
                    batch_status: success
                    transactions:
                      - easebuzz_id: E23122737JPNST
                        error_message: ''
                        settlement_status: success
                        requested_at: '27-12-2023 07:48:23 PM'
                        txn_settlement_amount: 7295
                        settlement_info:
                          settlement_id: PSLWHP7KWN
                          utr_number: '312283551324'
                          total_settlement_amount: '4443369'
                          settled_at: 28-12-2023
              examples:
                Success:
                  value:
                    status: true
                    batch_status: success
                    transactions:
                      - easebuzz_id: E24XXXXXXXT
                        error_message: ''
                        settlement_status: success
                        requested_at: '01-01-2024 18:00:00 PM'
                        txn_settlement_amount: 12345
                        settlement_info:
                          settlement_id: PXXXXXXX
                          utr_number: XXXXXXXXXXX
                          total_settlement_amount: '9876'
                          settled_at: 02-01-2024
      x-stoplight:
        id: j6v1nmy74m325
      description: |-
        Effortlessly track the progress of your on-demand settlement requests using our Status API. It offers real-time updates, ensuring transparency regarding the status of your financial transactions.

        > **Hash sequence:**  ```key|merchant_email|merchant_batch_id|salt```
