          description: Successful response
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  example-1:
                    status: true
                    refund_amount: 1
                    reason: 'Refund initiated, Your Request Id:RU0EBGAKA9'
                    easebuzz_id: T3W4E9GPRZ
                    refund_id: RU0EBGAKA9
                properties:
                  status:
                    type: boolean
                  refund_amount:
                    type: integer
                    description: The amount to be refunded.
                  reason:
                    type: string
                  easebuzz_id:
                    type: string
                    description: The unique ID assigned to the transaction by Easebuzz while the transaction was iniated in the easebuzz system.
                  refund_id:
                    type: string
                    description: The unique identifier for the refund request.
              examples:
                success:
                  value:
                    status: true
                    refund_amount: 1
                    reason: 'Refund initiated, Your Request Id:RU0EBGAKA9'
                    easebuzz_id: T3W4E9GPRZ
                    refund_id: RU0EBGAKA9
      description: |-
        Easebuzz supports the ability to refund charges made to your account, either in whole or in part. We submit refund requests to your customer’s bank or card issuer immediately. Your customer sees the refund as a credit approximately 5-10 business days later, depending upon the bank. Once issued, a refund cannot be canceled. To refund a charge via the API, perform a create refund call, providing the transaction ID of the charge to be refunded. Request a refund for the transaction.

        > **Note:** It is critical to configure [**webhooks**](https://docs.easebuzz.in/docs/payment-gateway/587zy3v064so6-what-are-webhooks) as this will allow the Easebuzz system to 'push' data to your system whenever any event occurs, ensuring that both systems are always in sync.

        **Hash sequence:** 
        ```
        key|txnid|amount|refund_amount|email|phone|salt
        ```
