info:
  title: Refund APIs
  version: 1.0.0
  description: |
    ### Refund Statuses
    ---

    Please find the below refund statuses and their respective description received from the Easebuzz side in response:


    Event | Description
    ------- | -------
    **queued** | The refund has not been initiated yet. Easebuzz is holding the refund request due to insufficient future settlement/payout amounts available with the merchant.
    **approved** | The Acquiring Bank has approved the refund request and will process it accordingly.
    **refunded** | The refund has been successfully processed, and the funds have been transferred to the customer’s bank account.
    **Cancelled Refund** | The refund request has been cancelled by the merchant, and no refund will be processed.
    **Cancelled Chargeback** | The dispute (chargeback) has been resolved in the merchant's favour, and the chargeback has been closed.
    **Hold Refund** |The refund has been successfully processed to the customer's bank, but it hasn't been adjusted from the merchant's settlement due to no future payout available.
