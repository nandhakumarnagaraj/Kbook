  /transaction/v1/refund:
    post:
      summary: Refund API
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                example-1:
                  key: 4Z9D9HGPNL
                  txnid: E220926A96XSXX
                  refund_amount: 1
                  phone: '9987971694'
                  email: suratkaryogita@gmail.com
                  amount: 2.5
                  hash: bd0bd96e81b20a8e922c90d0e4fe7f6ea4f3caf3d262e2d2c20c83d93a693c85faa9845216675d67d892b2147c8f27675aeef471f10e88a813f68d83113d1503
              required:
                - key
                - txnid
                - refund_amount
                - phone
                - email
                - amount
                - hash
              properties:
                key:
                  type: string
                  description: Unique Merchant Key provided by Easebuzz for your merchant account.
                  pattern: '^[a-zA-Z0-9_]{1,15}$'
                txnid:
                  type: string
                  description: Unique **Easebuzz Id** that you will receive in the response of the transaction.
                  pattern: '^[a-zA-Z0-9]*$'
                refund_amount:
                  type: integer
                  description: 'The amount to be refunded for the particular transaction. **Note**: Please type-cast the amount to float type.'
                phone:
                  type: string
                  description: Phone number of the customer.
                  pattern: '^(\+\d{1,4}[-]?)?\d{5,20}$'
                email:
                  type: string
                  description: Email of the customer.
                  pattern: '^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$'
                amount:
                  type: number
                  description: 'The payment amount of the particular transaction. Note: Please type-cast the amount to float type.'
                hash:
                  type: string
                  description: |-
                    This is sha512 encrypted string. And hash sequence is mentioned above.
                    **Hash sequence:** key|txnid|amount|refund_amount|email|phone|salt
                  pattern: '^[a-zA-Z0-9_]{64,128}$'
                udf1:
                  type: string
                  x-stoplight:
                    id: 4m62ipirndru0
                  description: User Defined field
                  pattern: '''^[a-zA-Z\.0-9/\\,\s_#@\-=+&]*$'''
                udf2:
                  type: string
                  x-stoplight:
                    id: znj1suz1tgi4u
                  description: User Defined field
                  pattern: '''^[a-zA-Z\.0-9/\\,\s_#@\-=+&]*$'''
                udf3:
                  type: string
                  x-stoplight:
                    id: 849049ogof737
                  description: User Defined field
                  pattern: '''^[a-zA-Z\.0-9/\\,\s_#@\-=+&]*$'''
                udf4:
                  type: string
                  x-stoplight:
                    id: zunv8h6tu5o1l
                  description: User Defined field
                  pattern: '''^[a-zA-Z\.0-9/\\,\s_#@\-=+&]*$'''
                udf5:
                  type: string
                  x-stoplight:
                    id: xogwc88zb1rec
                  description: User Defined field
                  pattern: '''^[a-zA-Z\.0-9/\\,\s_#@\-=+&]*$'''
                udf6:
                  type: string
                  x-stoplight:
                    id: 579m25agn9mwr
                  description: User Defined field
                  pattern: '''^[a-zA-Z\.0-9/\\,\s_#@\-=+&]*$'''
                udf7:
                  type: string
                  x-stoplight:
                    id: ro66u39uw32qv
                  description: User Defined field
                  pattern: '''^[a-zA-Z\.0-9/\\,\s_#@\-=+&]*$'''
            examples:
              example-1:
                value:
                  key: XXXXXXXX
                  txnid: E22XXA96XSXX
                  refund_amount: 1
                  phone: 99XXXXX694
                  email: XXXXXXXX@gmail.com
                  amount: 2.5
                  hash: bd0bd96e81b20a8e922c90d0e4fe7f6ea4f3caf3d262e2d2c20c83d93a693c85faa9845216675d67d892b2147c8f27675aeef471f10e88a813f68d83113d1503
