      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - merchant_key
                - amount
                - txnid
                - checksum
              properties:
                merchant_key:
                  type: string
                  x-stoplight:
                    id: vk07xrskd3wcq
                  description: Unique Merchant Key provided by Easebuzz for your merchant account.
                amount:
                  type: number
                  x-stoplight:
                    id: n16jbi5vwb8ye
                  description: 'The amount value, that you want to capture.'
                txnid:
                  type: string
                  x-stoplight:
                    id: 72m3etq8nf0vo
                  description: Unique Easebuzz Id generated by Easebuzz. You will receive this value in the transaction response.
                checksum:
                  type: string
                  x-stoplight:
                    id: dgqjsq662in4a
                  description: 'This is sha512 encrypted string. And hash sequence is mentioned above. Hash sequence: `merchant_key|amount|txnid|salt`'
                split_payments:
                  type: string
                  x-stoplight:
                    id: ocstmlni7781r
                  description: |-
                    **Note:** Split labels, if updated in capture API then same will be updated in system and old labels will
                    be deleted.<br>
                    Split of the transaction amount based on the labels configured for split on Easebuzz.

