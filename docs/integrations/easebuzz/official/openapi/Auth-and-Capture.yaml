                    Reason to void the transaction.
        description: ''
      description: |-
        **UseCase**: To void (unblock) an authorized transaction if not captured


        **Description**: This API is used to initiate the Void request with Easebuzz for any authorized transaction
        which merchant is not willing to Capture. It accepts all the required parameters and returns a success or
        failure response.

        ---
        1. Refunds can only be done for the captured amount.
        2. Merchant has to initiate the request with Easebuzz either through dashboard or Refund API.
        3. Once request is received, Easebuzz will check the refund details and merchant payout equal to the refund amount will be put on hold.
        4. Easebuzz will then initiate the refund request with acquirer which will get it processed through Issuer bank.
        5. Once acquirer confirms back of the refund status, the same will be shared with merchant.
        6. Merchant can then update the user of the refund status.
        7. Standard refund TAT is 7 working days from the date of refund initiation.
        ---

        > **Note:** There could be multiple use-cases of Refund / un-blocking of captured and un-captured amount:


        | S. No.| Auth  | Capture | Refund Type   | Refund Type Description | Workflow |
        | -- | ------- | --------------  | ----------- | ------------------ | ------------ |
        | 1. | Success | Full Capture    | Refund requested     | full refund requested after capture                                  | Standard refund workflow |
        | 2. | Success | Partial Capture | Partial Auto unblock | auto-unblock of un-captured amount after capture period              | auto-initiated after T+4 |
        | 3. | Success | Partial Capture | Partial Auto unblock | request for un-blocking the un-captured amount during capture period | Void API + configuration to be done at bank’s end |
        | 4. | Success | Partial Capture | Refund requested     | request for refund of partially captured amount                      | Standard refund workflow |
        | 5. | Success | No capture      | Auto unblock         | auto unblock of full amount after capture  period                    | auto-initiated after T+4 |
        | 6. | Success | No capture      | Un-block requested   | request for un-blocking the un-captured amount during capture period | Void API + configuration to be done at bank’s end |


        **Hash sequence:** 
        ```
        merchant_key|txnid|salt
        ```
