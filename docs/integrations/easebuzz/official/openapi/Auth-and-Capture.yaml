      description: |-
        **UseCase**: Capture an authorized transaction.

        **Description**: This API is used to send a capture request to Easebuzz for an authorized transaction. It
        accepts all the required parameters and returns a pending or failure response, which is then used to further
        process the transaction.

        > ***Note:*** Capture can be initiated within T+4 of the authorization. Post this, the authorization will be considered void and the amount blocked / reserved in user’s account will be freed.
        ---
        1. After authorization, merchant has to fulfil the services requested by the customer.
        2. On successful fulfilment, merchant to initiate the Capture request for the same Auth transaction with Easebuzz within the pre-defined time limit and with Capture amount less than or equal to the Auth amount.
        3. On receiving the Capture request, Easebuzz to do the necessary checks and initiate the capture request with Acquirer referencing the original Auth transaction.
        4. Acquirer routes the debit request to Issuer through Card Network. As the requested amount is already authorized for debit, Issuer debits the user account directly.
        5. Issuer marks the transaction as Captured and updates the acquirer which in turn sends the response to Easebuzz.
        6. Easebuzz then updates merchant about the transaction (Capture) status which then further updates the user.
        ---

        **Hash sequence:** 
        ```
        merchant_key|amount|txnid|salt
        ```
      x-stoplight:
        id: 4b98sx2z183ms
      x-internal: false
    parameters: []
