                  description: Easebuzz transaction ID shared in the authorization response.
                checksum:
                  type: string
                  x-stoplight:
                    id: 7a4b5g0rmcy5r
                  description: 'Hash is a crucial parameter – used specifically to avoid any tampering during the transaction. This is sha512 encrypted string. Hash sequence: `merchant_key|txnid|salt`'
                reason:
                  type: string
                  x-stoplight:
                    id: y5es6sc4rd54l
