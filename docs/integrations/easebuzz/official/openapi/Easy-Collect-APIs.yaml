    post:
      summary: Create/Update Link
      requestBody:
        content:
          application/json:
            schema:
              type: object
              x-examples:
                example-1:
                  key: D1K8SLB2XW
                  name: Sagar Sawant
                  phone: '8805596828'
                  amount: '1.0'
                  hash: 33804076e20ae5bc806cd82e7af9925cb80e96608bf279b7b8e0360c0c51b7804cd3188913bd5279e8f85a373d2788ca4981a0425b2b239b94114384fac143ec
                  merchant_txn: EBZTestTxn0003
                  email: sagar.sawant@easebuzz.in
                  message: Test Create Link
              required:
                - key
                - name
                - phone
                - amount
                - hash
                - token
              properties:
                key:
                  type: string
                  description: "Unique Merchant Key provided by Easebuzz for your merchant account. \r\n> This parameter is ***mandatory*** if you are not using token authentication to create EasyCollect links."
                name:
                  type: string
                  description: Customer name for easycollect link
                phone:
                  type: string
                  description: Phone number associated with easycollect link
                amount:
                  type: string
                  description: Amount for link payment
                hash:
                  type: string
                  description: |-
                    This is sha512 encrypted string. And hash sequence is mentioned above
                    Hash sequence: key|merchant_txn|name|email|phone|amount|udf1|udf2|udf3|udf4|udf5|message|salt

                    > If you are utilizing Token Authentication API for EasyCollect Links, there's no need for a hash generation.
                email:
                  type: string
                  description: Email Id associated with easycollect link
                merchant_txn:
                  type: string
                  description: 'Unique Id for easycollect link. If not passed, this will be generated automatically'
                message:
                  type: string
                  description: Message associated with payment link
                udf1:
                  type: string
                  description: 'User defined field 1 – Allowed characters : Letters, numbers, space'
                udf2:
                  type: string
                  description: 'User defined field 1 – Allowed characters : Letters, numbers, space'
                udf3:
                  type: string
                  description: 'User defined field 1 – Allowed characters : Letters, numbers, space'
                udf4:
                  type: string
                  description: 'User defined field 1 – Allowed characters : Letters, numbers, space'
                udf5:
                  type: string
                  description: 'User defined field 1 – Allowed characters : Letters, numbers, space'
                expiry_date:
                  type: string
                  description: 'Date must be in (DD-MM-YYYY HH:MM:SS AM/PM) or ( DD-MM-YYYY ) format.'
                operation:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        description: sms/email/whatsapp
                      template:
                        type: string
                        description: Default sms/email/whatsapp template
                update:
