                  description: 'If you want to update the Easycollect link, send  "true" as value of this parameter'
                active:
                  type: boolean
                  description: |-
                    Pass **"active"** as **"true"** if you want to activate the link and **"false"** if you want to deactivate the link
                    > **Note:** You must set **"update"** value as **"true"** if you want to update link details
                token:
                  type: string
                  x-stoplight:
                    id: kev4qswrhjsln
                  description: "Token received from Easy Collect Authenticate API. \r\n> This parameter is ***mandatory*** if you are not using key and salt to create EasyCollect links."
