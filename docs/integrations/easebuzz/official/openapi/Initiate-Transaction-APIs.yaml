openapi: 3.0.0
x-stoplight:
  id: viyex0lwoda66
info:
  title: Initiate Transaction APIs
  version: 1.0.0
  description: |-
    <div style="text-align:left;">
        <span>
            <span style="display: inline-block; background:linear-gradient(135deg,#484eff 0%,#1eefb0 94.79%);border-radius: 16px; background-clip: text;-webkit-background-clip: text; color: rgba(0, 0, 0, 0.2);font-size:25px;text-decoration: underline;">
              <a href="/docs/payment-gateway/8ec545c331e6f-initiate-payment-api" >Initiate Payment API</a>
            </span>
        </span>
    </span>
servers:
  - description: 'Sandbox URL '
    url: 'https://testpay.easebuzz.in'
  - description: Production URL
    url: 'https://pay.easebuzz.in'
paths:
  /payment/initiateLink:
    post:
      summary: Initiate Payment API
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
                - key
                - txnid
                - amount
                - productinfo
                - firstname
                - phone
                - email
                - surl
                - furl
                - hash
              properties:
                key:
                  type: string
                  description: 'This parameter is the unique Merchant Key provided by Easebuzz for your merchant account. The Merchant Key acts as the unique identifier (primary key) to identify a particular Merchant Account for our interpretation. While posting the data to us, you need to send this Merchant Key value.'
                  pattern: '^[a-zA-Z0-9_]{1,15}$'
                txnid:
                  type: string
                  description: This parameter is known as Transaction ID. It is the transaction reference number generated at your (Merchant’s) end. It is an identifier which you (merchant) would use to track a particular transaction. it is essential that you post us a unique transaction ID for every new transaction. **Please ensure that the txnid does not exceed 40 characters in length.**
                  pattern: '^[a-zA-Z0-9_\|\-\/]{1,40}$'
                amount:
                  type: number
                  example: '^[0-9.]*$'
                  description: 'This parameter should contain the payment amount of the particular transaction. Note: Please type-cast the amount to float type. **The maximum transaction amount limit is ₹ 99,99,999 by default.**'
                productinfo:
                  type: string
                  description: This parameter should contain a brief product description. It should be a string describing the product (The description type is entirely your choice). **The maximum length should not be greater than 45 characters.**
                  pattern: '^[a-zA-Z0-9-\s\|\-]{1,45}$'
                firstname:
                  type: string
                  description: |-
                    Name of the customers.
                    **The maximum allowed length for the customer's name is 150 characters.**
                  pattern: '^[a-zA-Z0-9&\-._ \()/,@]{1,150}$'
                phone:
                  type: integer
                  description: Phone number of the customer. **The maximum length is 20 digits.**
                  example: '^(\+\d{1,4}[-]?)?\d{5,20}$'
                email:
                  type: string
                  description: Email ID of the customer. **The maximum allowed length for the customer's email is 200 characters**.
                  pattern: '^(([^<>()\[\]\.,;:\s@"]+(\.[^<>()\[\]\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$'
                surl:
                  type: string
                  description: |-
                    Success URL - This parameter must contain the URL on which Easebuzz will redirect the final response if the transaction is successful. The response handling can then be done by you after redirection to this URL.
                    **The maximum length should not be greater than 2000 characters.**
                  pattern: 'http[s]?://(?:[a-zA-Z]|[0-9]|[$-_@.&+]|[!*\(\),]|(?:%[0-9a-fA-F][0-9a-fA-F])){1,2000}$'
                furl:
                  type: string
                  description: |-
                    Failure URL - This parameter must contain the URL on which Easebuzz will redirect the final response if the transaction is failed. The response handling can then be done by you after redirection to this URL.
                    **The maximum length should not be greater than 2000 characters.**
                  pattern: 'http[s]?://(?:[a-zA-Z]|[0-9]|[$-_@.&+]|[!*\(\),]|(?:%[0-9a-fA-F][0-9a-fA-F])){1,2000}$'
                hash:
                  type: string
                  description: 'Hash is a crucial parameter – used specifically to avoid any tampering during the transaction. This is sha512 encrypted string. Hash sequence: `key|txnid|amount|productinfo|firstname|email|||||||||||salt`'
                  pattern: '^[a-zA-Z0-9_]{64,128}$'
                udf1:
                  type: string
                  description: 'User defined field 1 – This parameter has been made for you to keep any information corresponding to the transaction, which may be useful for you to keep in the database. UDF1-UDF7 fields are for this purpose only. It’s completely for your usage and you can post any string value in this parameter. udf1-udf7 are optional parameters and you may use them only if needed. Allowed characters : Letters, numbers, underscore, space,hyphen, dot(period)'
                  pattern: '^[a-zA-Z\.0-9/\\,\s_#@\-=+&]{1,300}$'
                udf2:
                  type: string
                  description: 'User defined field 2 – User Defined field 2. Allowed characters : Letters, numbers, underscore, space,hyphen, dot(period)'
                  pattern: '^[a-zA-Z\.0-9/\\,\s_#@\-=+&]{1,300}$'
                udf3:
                  type: string
                  description: 'User defined field 3 – User Defined field 3. Allowed characters : Letters, numbers, underscore, space,hyphen, dot(period)'
                  pattern: '^[a-zA-Z\.0-9/\\,\s_#@\-=+&]{1,300}$'
                udf4:
                  type: string
                  description: 'User defined field 4 – User Defined field 4. Allowed characters : Letters, numbers, underscore, space,hyphen, dot(period)'
                  pattern: '^[a-zA-Z\.0-9/\\,\s_#@\-=+&]{1,300}$'
                udf5:
                  type: string
                  description: 'User defined field 5 – User Defined field 5. Allowed characters : Letters, numbers, underscore, space,hyphen, dot(period)'
                  pattern: '^[a-zA-Z\.0-9/\\,\s_#@\-=+&]{1,300}$'
                udf6:
                  type: string
                  description: 'User defined field 6 – User Defined field 6. Allowed characters : Letters, numbers, underscore, space,hyphen, dot(period)'
                  pattern: '^[a-zA-Z\.0-9/\\,\s_#@\-=+&]{1,300}$'
                udf7:
                  type: string
                  description: 'User defined field 7 – User Defined field 7. Allowed characters : Letters, numbers, underscore, space,hyphen, dot(period)'
                  pattern: '^[a-zA-Z\.0-9/\\,\s_#@\-=+&]{1,300}$'
                address1:
                  type: string
                  description: 'This parameter is an optional parameter that can be used to pass the address. Allowed characters : Letters, numbers, comma, space, dot(period), hash, slash, hyphen, underscore.'
                  pattern: '^[a-zA-Z\.0-9/\,\s_#@()&|:-]{1,100}$'
                address2:
                  type: string
                  description: 'This parameter is an optional parameter that can be used to pass the address. Allowed characters : Letters, numbers, comma, space, dot(period), hash, slash, hyphen, underscore.'
                  pattern: '^[a-zA-Z\.0-9/\,\s_#@()&|:-]{1,100}$'
                city:
                  type: string
                  description: Customer City
                  pattern: '^[0-9a-zA-Z_.\s-]{1,50}$'
                state:
                  type: string
                  description: Customer State
                  pattern: '^[0-9a-zA-Z_.\s-]{1,50}$'
                country:
                  type: string
                  description: Customer Country
                  pattern: '^[0-9a-zA-Z_.\s-]{1,50}$'
                zipcode:
                  type: string
                  description: Customer Zipcode
                  pattern: '^[0-9]{0,6}$'
                show_payment_mode:
                  type: string
                  description: |-
                    Add the below details in show_payment_mode

                    Pass the require payment values with comma separated like below
                    show_payment_mode: ‘NB,DC,CC,MW,UPI,OM,EMI,CBT,BT’

                    **Details:**

                    Payment Mode| Value | 
                    ---------|----------|
                     Net Banking| NB | 
                     Credit Card| CC | 
                     Debit card| DC | 
                     Mobile Wallet| MW | 
                     UPI| UPI | 
                     Ola Money| OM| 
                     EMI| EMI | 
                     Pay Later| PL | 
                     E - CHALLAN| CBT | 
                     Easy Installments| EI |
                     IMPS / NEFT / RTGS| BT | 

                    If Credit Card, Debit Card and UPI are enabled for the Merchant and he requests to show the following modes: `CC, DC, UPI`
                    Then only a Credit Card and Debit Card will be allowed on the payment page.
                    Since this is the mode that is enabled for merchant and requested by merchant, Net Banking will not be visible because it was not enabled for Merchant by Easebuzz.

                    > **NOTE:** If show parameter mode is empty then all modes that are enabled for the Merchant will be visible.
                split_payments:
                  type: object
                  description: |-
                    If split payment feature is enabled for merchant account, then it is mandatory to pass this parameter. You can split the transaction amount across multiple split bank accounts mapped to your account.

                    **Expected Value**: {"label_of_bank1" : split_amount_in_rs, "label_of_bank2": split_amount_in_rs}

                    **Split payment example**:  { "Easebuzztest 1": 11.0, "Easebuzztest  2": 1.0 }
                request_flow:
                  type: string
                  description: 'For Seamless Payment, you have to pass this parameter with value as "SEAMLESS"'
                sub_merchant_id:
                  type: string
                  description: 'In case of aggregator setup, the submerchant unique id to initiate transaction towards the submerchant account. Mandatory if aggregator/submerchant setup is enabled.'
                  pattern: '^[a-zA-Z0-9\-]{0,15}$'
                payment_category:
                  type: string
                  description: Pass this parameter if you want to do the Third Party Validation (**TPV**) for transaction. Mandatory for TPV payments.
                  x-stoplight:
                    id: zv09s8oeqr3wg
                account_no:
                  type: string
                  description: Pass the customer's account number if you want to do the third party validation (TPV) on transaction. Mandatory for TPV payments.
                  pattern: '^[0-9]*$'
                ifsc:
                  type: string
                  x-stoplight:
                    id: rrqipmo1ac9of
                  description: Pass the customer's IFSC code if you want to do the third party validation (TPV) on transaction. Mandatory for TPV payments.
                  pattern: '^[A-Z]{4}0[A-Z0-9]{6}$'
                unique_id:
                  type: string
                  x-stoplight:
                    id: k7vmqcp833idf
                  description: Pass the unique value in this parameter if you want to save customer card on Easebuzz checkout.
                  pattern: '^[a-zA-Z0-9_]{0,40}$'
            examples:
              Initiate Transaction APIs:
                value:
                  key: D111111112W
                  txnid: EBZTestTxn00
                  amount: 3
                  productinfo: test product info
                  firstname: Sagar
                  phone: 8805596828
                  email: sagar.sawant@easebuzz.in
                  surl: 'http://localhost:3000/response'
                  furl: 'http://localhost:3000/response'
                  hash: 956cab3c46dca68628b7dfc34c2bbb4cf93af3698dd911ec11983f650f65acfba78d2ee4c3652d1707fa588333a5926dc1b3f7dec9059e4e9f54728d31c8ecc7
                  udf1: ''
                  udf2: ''
                  udf3: ''
                  udf4: ''
                  udf5: ''
                  udf6: ''
                  udf7: ''
        description: ''
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                  data:
                    type: string
                  error_desc:
                    type: string
                x-examples:
                  Example 1:
                    status: 0
                    data: Transaction cannot be processed. Duplicate transaction id.
                    error_desc: Kindly retry your transaction.
              examples:
                Success response:
                  value:
                    status: 1
                    data: 114e574f3d63ca3a88f5f2c470869f926b147faa8a41c63f6381254ab28d26a9
                Error - Invalid Merchant key:
                  value:
                    status: 0
                    error_desc: Invalid merchant key.
                    data: Parameter validation failed
                Error - Duplicate txn ID:
                  value:
                    status: 0
                    data: Transaction cannot be processed. Duplicate transaction id.
                    error_desc: Kindly retry your transaction.
                Error - Hash Mismatch:
                  value:
                    status: 0
                    error_desc: Payment cannot be verified. Hash mismatch.
                    data: Parameter validation failed
      description: "Easebuzz payments work by creating request URLs which can accept payments. From your backend language, make a server-to-server call to our server(test or production) with the required parameters like the key, amount, transaction id. You can check out the complete list of mandatory and optional parameters in below table. Please ensure that all parameters are trimmed (leading and trailing white spaces are removed) before generating the hash.\n\n> **Note:**\n> - It is mandatory to integrate the [**Transaction API**](https://docs.easebuzz.in/docs/payment-gateway/f607brr7f8ek8-transaction-api-v2-1).\n> - Also, it is critical to configure [**webhooks**](https://docs.easebuzz.in/docs/payment-gateway/587zy3v064so6-what-are-webhooks) as this will allow the Easebuzz system to 'push' data to your system whenever any event occurs, ensuring that both systems are always in sync.\n> - Once you receive the response on SURL or FURL, it is mandantory to verify the hash using reverse hash sequence.\n> - udf8, udf9, and udf10 should be always empty. we are not allow to pass this udf currently.\n\n**Hash sequence:** \n```\nkey|txnid|amount|productinfo|firstname|email|udf1|udf2|udf3|udf4|udf5|udf6|udf7|udf8|udf9|udf10|salt\n```\n\n> **Note :** Retrieve the access key from the Initiate Payment API response, and append it to the Sandbox (UAT) or Production URL, and load it in a browser to open the hosted checkout.<br> **Sandbox URL:**\thttps://testpay.easebuzz.in/pay/access-key <br> **Production URL:**\thttps://pay.easebuzz.in/pay/access-key <br> **Example:** https://pay.easebuzz.in/pay/b2904ebxxxxxxxxxxxxxxxxxxxxxxxxb99aa84"
      operationId: post-payment-initiateLink
