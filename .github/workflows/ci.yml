name: CI

# Every push to main and every PR runs all three test suites.
# This is the guard against "new implementation breaks existing features":
# a failing check blocks the merge/push before it reaches production.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests (Spring Boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # TODO(re-include excluded classes): these 6 classes already fail on main
      # (Easebuzz webhook notification arg drift). The four bill-push 409 classes
      # were un-excluded on 2026-09-29: the second-writer defect behind their false
      # 409s is fixed (preserveServerOwnedState no longer restores orderStatus;
      # inventory deduction is version-neutral), all 35 pass locally.
      # They are excluded so CI starts green; REMOVE them from this list as each
      # is fixed — do not add new ones.
      - name: Run server tests
        working-directory: server
        run: >
          ./mvnw -B test
          -Dtest='!EasebuzzWebhookTest,!EasebuzzWebhookServiceTest'
          -Dsurefire.failIfNoSpecifiedTests=false

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      # google-services.json is per-developer Firebase config and is gitignored
      # on purpose, but the Google Services plugin hard-fails the build when the
      # file is missing. Unit tests never talk to Firebase, so write a stub with
      # the real application ids — the plugin needs the shape, not live credentials.
      # Two clients are required: the release id, and the debug id, because the
      # debug build type adds an applicationIdSuffix of ".debug".
      - name: Create stub google-services.json
        working-directory: Android/app
        run: |
          cat > google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "khanabook-ci-stub",
              "storage_bucket": "khanabook-ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.piquantservices.khanabooklite"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-ci-stub.apps.googleusercontent.com",
                    "client_type": 3,
                    "android_client_info": {
                      "package_name": "com.piquantservices.khanabooklite"
                    }
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCI-STUB-KEY-NOT-A-REAL-CREDENTIAL-0000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111111111",
                  "android_client_info": {
                    "package_name": "com.piquantservices.khanabooklite.debug"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "000000000000-ci-stub.apps.googleusercontent.com",
                    "client_type": 3,
                    "android_client_info": {
                      "package_name": "com.piquantservices.khanabooklite.debug"
                    }
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyCI-STUB-KEY-NOT-A-REAL-CREDENTIAL-0000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Run Android unit tests
        working-directory: Android
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

  web-admin:
    name: Web-admin tests (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-admin/package-lock.json

      - name: Install dependencies
        working-directory: web-admin
        run: npm ci

      - name: Run Angular tests (headless Chrome)
        working-directory: web-admin
        run: npm test -- --watch=false --browsers=ChromeHeadless
