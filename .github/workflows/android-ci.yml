name: Android CI

on:
  push:
    branches: [ main ]
    paths:
      - 'Android/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'Android/**'

jobs:
  android-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create dummy google-services.json
        run: |
          mkdir -p app
          echo '{"project_info":{"project_number":"000000000000","project_id":"khanabook-dummy","storage_bucket":"khanabook-dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.piquantservices.khanabooklite.debug"}},"oauth_client":[],"api_key":[{"current_key":"DUMMY_KEY_FOR_CI"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: Android/app/build/reports/tests/
          retention-days: 7

  android-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create dummy google-services.json
        run: |
          mkdir -p app
          echo '{"project_info":{"project_number":"000000000000","project_id":"khanabook-dummy","storage_bucket":"khanabook-dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.piquantservices.khanabooklite.debug"}},"oauth_client":[],"api_key":[{"current_key":"DUMMY_KEY_FOR_CI"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-results
          path: Android/app/build/reports/lint-results-debug.html
          retention-days: 7

  # The app/src/androidTest suite (30 files: menu config, part payment, new bill, KDS,
  # migrations) had no job anywhere, so none of it ever ran. Bugs like the menu variant
  # price one are only reachable on a device, which is exactly the gap this closes.
  #
  # continue-on-error is intentional and temporary: the suite has never been executed, so
  # the first run is expected to be red. This surfaces the true state without blocking
  # merges. Once it is green, delete the continue-on-error line to make it a real gate.
  android-instrumented-tests:
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Create dummy google-services.json
        run: |
          mkdir -p app
          echo '{"project_info":{"project_number":"000000000000","project_id":"khanabook-dummy","storage_bucket":"khanabook-dummy.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.piquantservices.khanabooklite.debug"}},"oauth_client":[],"api_key":[{"current_key":"DUMMY_KEY_FOR_CI"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-results
          path: |
            Android/app/build/reports/androidTests/
            Android/app/build/outputs/androidTest-results/
          retention-days: 7
