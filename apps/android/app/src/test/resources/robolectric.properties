# Robolectric runs every unit test against a simulated Android runtime.
# The app targets SDK 36; Robolectric 4.15.x ships Android 15 (SDK 35) as its newest
# runtime, so pin to 34 (Android 14) — the closest well-supported image to the fleet.
# Pinning also keeps goldens stable when compileSdk/targetSdk are bumped.
sdk=34
