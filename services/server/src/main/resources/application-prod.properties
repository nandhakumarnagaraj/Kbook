# ===============================
# PRODUCTION OVERRIDES
# Activated via: --spring.profiles.active=prod
# All secrets MUST come from environment variables — never hardcode here.
# ===============================

# ===============================
# LOGGING — structured JSON for log aggregation (Loki / ELK)
# ===============================
# JSON output comes from logback-spring.xml (Logstash encoder). Do NOT also set
# logging.structured.format.console=ecs here: two structured configs fight and
# the ECS one wins silently, dropping the MDC fields ops filters by.
logging.pattern.console=

# Suppress noisy framework logs in production
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.khanabook=INFO

# ===============================
# JPA — never print SQL in production
# ===============================
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# CORS — set allowed origins explicitly for browser clients
# Comma-separated, e.g.: https://app.khanabook.com,https://admin.khanabook.com
# ===============================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ===============================
# SPRINGDOC — keep API docs off on production unless explicitly re-enabled
# ===============================
springdoc.api-docs.enabled=${SPRINGDOC_API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED:false}

# ===============================
# ACTUATOR — expose health + prometheus + info (build/git); hide everything else
# ===============================
management.endpoints.web.exposure.include=health,prometheus,info
# /actuator/health is permitAll so uptime monitors can reach it without a token.
# show-details=always therefore published component-level infrastructure state
# (database, disk, redis) to anonymous callers. Details are now KBOOK_ADMIN only;
# anonymous callers still get {"status":"UP"}, which is all the probes read.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=KBOOK_ADMIN
# Show full git commit details (id, branch, time) at /actuator/info to verify deployed build
management.info.git.mode=full

# ===============================
# SERVER — enable compression, set connection limits
# ===============================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/plain
server.compression.min-response-size=1024
server.tomcat.max-connections=10000
server.tomcat.accept-count=200
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20

# ===============================
# CACHE-CONTROL — ensure API responses are not cached by proxies
# ===============================
spring.web.resources.add-mappings=false

# v2 port: spring-boot-starter-mail adds a mail health indicator; SMTP is not
# reachable from the prod container, so exclude it from the health aggregate.
management.health.mail.enabled=false

# ===============================
# SYNC — require a terminal credential on terminal-operational push/pull
# ===============================
# Defaults to false in application.properties, which left BillTerminalUtil's legacy
# fallback (trustedTerminalId == null -> "modifiable by anyone") live in production:
# a transactional push with no X-Terminal-Token could edit any bill in the restaurant
# and the server had no terminal identity to check it against.
#
# Safe to switch on because the population already behaves as if it were on:
#   * restaurant_terminal.last_seen_at is written only from a token-authenticated
#     /sync/pull, and 25 terminals have been observed that way in the last 7 days;
#   * all 317 bills on record carry a terminal id, none are terminal-less.
# KBOOK_ADMIN remains exempt. Rollback without a rebuild: TERMINAL_SYNC_STRICT=false
terminal.sync.strict=${TERMINAL_SYNC_STRICT:true}
