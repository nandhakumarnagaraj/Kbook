# Local development overrides
# All secrets must be provided via environment variables — no hardcoded fallbacks.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kbook_saas}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:?Set DB_PASSWORD env var}

# WhatsApp / Meta Cloud API
whatsapp.meta.access-token=${WHATSAPP_META_ACCESS_TOKEN:?Set WHATSAPP_META_ACCESS_TOKEN env var}
whatsapp.meta.phone-number-id=${WHATSAPP_META_PHONE_NUMBER_ID:?Set WHATSAPP_META_PHONE_NUMBER_ID env var}
whatsapp.meta.otp-template-name=verify_code

# Google Auth
google.client.id=${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID env var}

# Easebuzz Gateway (Sandbox)
easebuzz.payment-base-url=${EASEBUZZ_PAYMENT_BASE_URL:https://testpay.easebuzz.in}
easebuzz.dashboard-base-url=${EASEBUZZ_DASHBOARD_BASE_URL:https://testdashboard.easebuzz.in}
easebuzz.merchant-key=${EASEBUZZ_MERCHANT_KEY:?Set EASEBUZZ_MERCHANT_KEY env var}
easebuzz.salt=${EASEBUZZ_SALT:?Set EASEBUZZ_SALT env var}
easebuzz.return-url=${EASEBUZZ_RETURN_URL:?Set EASEBUZZ_RETURN_URL env var}
easebuzz.notify-url=${EASEBUZZ_NOTIFY_URL:?Set EASEBUZZ_NOTIFY_URL env var}

# Security
jwt.secret=${JWT_SECRET:?Set JWT_SECRET env var (min 32 bytes random)}
payment.crypto.secret=${PAYMENT_CRYPTO_SECRET:?Set PAYMENT_CRYPTO_SECRET env var}

# Local CDN for dev (no cwebp, local file serving)
kbook.cdn.base-path=${CDN_BASE_PATH:./cdn/restaurants/}
kbook.cdn.url-prefix=${CDN_URL_PREFIX:http://localhost:8081/api/v1/cdn/}
kbook.cdn.tmp-path=${CDN_TMP_PATH:./cdn/tmp/}
kbook.cdn.cwebp-bin=${CWEBP_BIN:}
kbook.cdn.max-upload-bytes=2097152

# Flyway and Hibernate
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui
