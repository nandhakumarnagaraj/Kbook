
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx2g

org.gradle.vfs.watch=true
org.gradle.daemon=true

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
hilt.enableKsp=true
ksp.incremental=false
android.bundle.enable16KPageAlignment=true
android.useV2Signing=true
RELEASE_VERSION_CODE=31
RELEASE_VERSION_NAME=1.0.31

# NOTE: a machine-specific JDK pin (org.gradle.java.home) must NOT live here.
# This file is committed and CI runs it on Linux, where a Windows JDK path makes
# Gradle abort with "Java home supplied is invalid".
# Local JDK selection goes in ~/.gradle/gradle.properties (not in this repo).
