<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>KhanaBook Web Admin</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' https://accounts.google.com 'unsafe-inline';
      style-src 'self' https://fonts.googleapis.com https://accounts.google.com 'unsafe-inline';
      style-src-elem 'self' https://fonts.googleapis.com https://accounts.google.com 'unsafe-inline';
      font-src 'self' https://fonts.gstatic.com;
      img-src 'self' data: https://cdn.kbook.iadv.cloud;
      connect-src 'self' https://kbook.iadv.cloud https://accounts.google.com;
      frame-src https://accounts.google.com;
      base-uri 'self';
      form-action 'self';
      object-src 'none';
    ">
    <link rel="icon" type="image/png" href="/khanabook_logo.png" sizes="512x512">
    <link rel="apple-touch-icon" href="/khanabook_logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
