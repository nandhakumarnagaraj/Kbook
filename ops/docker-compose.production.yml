# Pinned explicitly. Compose otherwise infers the project name from the directory
# holding this file ("ops"), which does NOT match the live production stack
# ("kbookiadvcloud"). The mismatch made ops/deploy-production.sh build the wrong
# image tag, start a second postgres against an empty volume, and fail to bind
# 127.0.0.1:8081. Pin it so every ops/ script targets the real stack.
name: kbookiadvcloud

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    # No memory ceiling and no swap on this 31.34 GiB host, so a leak had no cgroup
    # limit to stop it and would have taken the other container down with it. These
    # are deliberately generous rather than tight: current usage is a few hundred
    # MiB, so the point is to fail ONE container and be restarted, not to reclaim
    # memory. Set at container create, so they apply on the next `up -d`, not now.
    mem_limit: 4g
    networks:
      - kbookiadvcloud_backend

  server:
    build:
      context: ../server
      dockerfile: Dockerfile
      args:
        # The build context is server/, so the plugin cannot see the repository.
        # deploy-production.sh supplies these. Left permissive here on purpose: the
        # hard failure lives in server/Dockerfile, which checks the stamped value is
        # a real 40-char sha rather than trusting an unset variable to be caught.
        GIT_COMMIT_ID: ${GIT_COMMIT_ID:-}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
        GIT_COMMIT_TIME: ${GIT_COMMIT_TIME:-unknown}
    restart: unless-stopped
    # Same reasoning as postgres. The JVM runs with -XX:MaxRAMPercentage=75, which
    # against an uncapped container meant a ~23.5 GiB heap ceiling with nothing to
    # stop it. 6g leaves roughly 8x headroom over current usage (~720 MiB) while
    # still bounding the process, and MaxRAMPercentage now resolves against this cap
    # rather than against the whole host. Applies on the next container create.
    mem_limit: 6g
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      WHATSAPP_META_ACCESS_TOKEN: ${WHATSAPP_META_ACCESS_TOKEN}
      WHATSAPP_META_PHONE_NUMBER_ID: ${WHATSAPP_META_PHONE_NUMBER_ID}
      WHATSAPP_META_OTP_TEMPLATE_NAME: ${WHATSAPP_META_OTP_TEMPLATE_NAME}
      WHATSAPP_META_STAFF_CREDENTIALS_TEMPLATE: ${WHATSAPP_META_STAFF_CREDENTIALS_TEMPLATE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://kbook.iadv.cloud}
      PAYMENT_CRYPTO_SECRET: ${PAYMENT_CRYPTO_SECRET}
      APP_BASE_URL: ${APP_BASE_URL}
      # Terminal sync strict mode (server default true). Rollback without a rebuild:
      # TERMINAL_SYNC_STRICT=false in .env, then docker compose up -d.
      TERMINAL_SYNC_STRICT: ${TERMINAL_SYNC_STRICT:-true}
      # Easebuzz Payment Gateway
      EASEBUZZ_MERCHANT_KEY: ${EASEBUZZ_MERCHANT_KEY}
      EASEBUZZ_SALT: ${EASEBUZZ_SALT}
      # Production must fail closed when gateway configuration is incomplete.
      # In particular, never fall back to Easebuzz sandbox URLs in this stack.
      EASEBUZZ_PAYMENT_BASE_URL: ${EASEBUZZ_PAYMENT_BASE_URL:?Set EASEBUZZ_PAYMENT_BASE_URL to the production gateway URL}
      EASEBUZZ_DASHBOARD_BASE_URL: ${EASEBUZZ_DASHBOARD_BASE_URL:?Set EASEBUZZ_DASHBOARD_BASE_URL to the production dashboard URL}
      EASEBUZZ_RETURN_URL: ${EASEBUZZ_RETURN_URL:?Set EASEBUZZ_RETURN_URL}
      EASEBUZZ_NOTIFY_URL: ${EASEBUZZ_NOTIFY_URL:?Set EASEBUZZ_NOTIFY_URL}
      EASEBUZZ_WEBHOOK_URL: ${EASEBUZZ_WEBHOOK_URL:?Set EASEBUZZ_WEBHOOK_URL}
      EASEBUZZ_WIRE_BASE_URL: ${EASEBUZZ_WIRE_BASE_URL:?Set EASEBUZZ_WIRE_BASE_URL to the production Wire URL}
      EASEBUZZ_WIRE_API_KEY: ${EASEBUZZ_WIRE_API_KEY:?Set EASEBUZZ_WIRE_API_KEY}
      CDN_BASE_PATH: ${CDN_BASE_PATH:-/var/www/cdn.kbook.iadv.cloud/restaurants/}
      CDN_URL_PREFIX: ${CDN_URL_PREFIX:-https://kbook.iadv.cloud/cdn/}
      CDN_TMP_PATH: ${CDN_TMP_PATH:-/var/www/cdn.kbook.iadv.cloud/tmp/}
      CWEBP_BIN: ${CWEBP_BIN:-cwebp}
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-framework}
      SPRINGDOC_API_DOCS_ENABLED: ${SPRINGDOC_API_DOCS_ENABLED:-false}
      SPRINGDOC_SWAGGER_UI_ENABLED: ${SPRINGDOC_SWAGGER_UI_ENABLED:-false}
      # Container timezone. Business dates are derived explicitly from the restaurant's
      # configured zone (BillSyncService.applyServerBusinessDate), so this is a backstop:
      # any un-zoned LocalDate.now()/LocalDateTime.now() that slips through review still
      # resolves to IST rather than UTC.
      TZ: ${TZ:-Asia/Kolkata}
      # Firebase push notifications (leave FIREBASE_CREDENTIALS_PATH empty to disable)
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-new-khanabook-li}
    command: ["sh", "-c", "sleep 3 && java -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom -jar app.jar"]
    volumes:
      - /var/www/kbook.iadv.cloud/server/uploads:/app/uploads
      - /var/www/cdn.kbook.iadv.cloud:/var/www/cdn.kbook.iadv.cloud
      - /var/www/kbook.iadv.cloud/secrets:/app/secrets:ro
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8081/api/v1/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - kbookiadvcloud_backend

networks:
  kbookiadvcloud_backend:
    external: true

volumes:
  pgdata:
