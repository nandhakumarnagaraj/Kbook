# Canonical nginx edge config for kbook.iadv.cloud.
# Live path:    /etc/nginx/sites-enabled/kbook.iadv.cloud
# Tracked copy: ops/nginx-kbook.iadv.cloud.conf (keep in sync; edit here then re-copy)
# Apply:        nginx -t && systemctl reload nginx
#
# NOTE: API/CDN locations use `^~` so the static-asset regex location
# (`~* \.(js|css|...)$`) cannot shadow proxied/aliased paths. Without `^~`,
# requests like /api/v1/swagger-ui/swagger-ui.css get served from the Angular
# docroot and 404 (swagger UI broke exactly this way on 2026-10-14).
server {
    listen 80;
    server_name kbook.iadv.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kbook.iadv.cloud;

    ssl_certificate /etc/letsencrypt/live/kbook.iadv.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kbook.iadv.cloud/privkey.pem;

    location = /kbook-debug.apk {
        alias /var/www/kbook.iadv.cloud/kbook-debug.apk;
        add_header Content-Disposition "attachment; filename=kbook-debug.apk";
        add_header Content-Type application/vnd.android.package-archive;
    }

    # ^~ so the static-asset regex location below cannot shadow /cdn/ files.
    location ^~ /cdn/ {
        alias /var/www/cdn.kbook.iadv.cloud/restaurants/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Investigation reports. Served from /var/www/helper directly rather than
    # from the web-admin dist/ folder, so an Angular rebuild cannot delete them.
    location = /result.txt {
        alias /var/www/helper/result;
        default_type text/plain;
        charset utf-8;
    }

    location = /webadminissues.txt {
        alias /var/www/helper/webadminissues;
        default_type text/plain;
        charset utf-8;
    }

    location = /issues.txt {
        alias /var/www/helper/issues.txt;
        default_type text/plain;
        charset utf-8;
    }

    location = /duplicates.txt {
        alias /var/www/helper/duplicates.txt;
        default_type text/plain;
        charset utf-8;
    }

    location = /Aboutkhanabook.txt {
        alias /var/www/helper/Aboutkhanabook.txt;
        default_type text/plain;
        charset utf-8;
    }

    location = /DesignDecisions.txt {
        alias /var/www/helper/DesignDecisions.txt;
        default_type text/plain;
        charset utf-8;
    }

    location = /menuerrors.txt {
        alias /var/www/helper/menuerrors.txt;
        default_type text/plain;
        charset utf-8;
    }

    location = /menuissues.txt {
        alias /var/www/helper/menuerrors.txt;
        default_type text/plain;
        charset utf-8;
    }

    location = /roles.txt {
        alias /var/www/helper/roles.txt;
        default_type text/plain;
        charset utf-8;
    }

    location = /audit.txt {
        alias /var/www/helper/audit.txt;
        default_type text/plain;
        charset utf-8;
    }

    # API backend
    # ^~ stops regex location matching so static-asset rules (\.js|\.css...)
    # below cannot shadow API paths like /api/v1/swagger-ui/swagger-ui.css.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Web Admin Dashboard (Angular SPA)
    location / {
        root /var/www/kbook.iadv.cloud/web-admin/dist/khanabook-web-admin/browser;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Hashed static assets (long-term caching)
    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|gif|ico)$ {
        root /var/www/kbook.iadv.cloud/web-admin/dist/khanabook-web-admin/browser;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
