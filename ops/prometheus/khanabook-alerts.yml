# KhanaBook — Prometheus alert rules for the money path.
#
# Load with:
#   rule_files:
#     - /etc/prometheus/khanabook-alerts.yml
#
# Metric names are the Actuator/Prometheus rendering of the Micrometer ids used
# in the code:
#   sync.push.records          -> sync_push_records_total{outcome="success|failed"}
#   sync.push.failed           -> sync_push_failed_total{reason="..."}
#   payments.webhook.dropped   -> payments_webhook_dropped_total{reason="..."}
#   payments.webhook.silence.seconds -> payments_webhook_silence_seconds
#
# Thresholds are deliberately conservative: KhanaBook is offline-first, so a
# terminal that is simply switched off also stops pushing. An alert must mean
# "the server is rejecting work", not "a tablet is at lunch".

groups:
  - name: khanabook-money-path
    rules:
      # A tenant whose pushes are being rejected is losing bills silently on the
      # device. Any sustained rejection rate is worth a look.
      - alert: KhanaBookSyncPushFailures
        expr: |
          sum by (reason) (rate(sync_push_failed_total[10m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Sync pushes are failing (reason {{ $labels.reason }})"
          description: >-
            More than 0.1 rejected records/sec for 10 minutes with reason
            {{ $labels.reason }}. Check sync_quarantine_records on the affected
            terminals and the server log filtered by restaurantId/terminalId.

      # Whole-batch rejection: records succeed elsewhere but one tenant fails
      # everything. This is the "stale push storm" shape.
      - alert: KhanaBookSyncBatchRejectionBurst
        expr: |
          sum by () (rate(sync_push_failed_total[5m]))
            / clamp_min(sum by () (rate(sync_push_records_total[5m])), 0.001)
            > 0.5
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Over half of all pushed records are being rejected"
          description: >-
            Likely one terminal stuck re-pushing a quarantined row (the known
            infinite-409 shape). Identify the tenant from sync_push_failed_total
            logs and clear the record on that terminal.

      # Amount mismatch is the one that loses money: the gateway reports success
      # but the amount does not match the bill, so the bill stays unpaid while the
      # customer believes they paid. Always worth a human.
      - alert: KhanaBookPaymentAmountMismatch
        expr: |
          sum(rate(payments_webhook_dropped_total{reason="amount_mismatch"}[10m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Easebuzz webhook amount does not match the bill"
          description: >-
            A payment succeeded at the gateway but the bill was not settled. Find
            the affected tenant with the bill id in the webhook log line
            ("Payment webhook amount mismatch billId=..."), then log queries
            filtered by restaurantId.

      # Hash mismatch means the signature failed: a rotated salt/secret, or simply
      # a spoofed request hitting the public webhook endpoint. It is common enough
      # from bots that it must not page anyone on its own — only a sustained,
      # unexplained rate over a long window is a configuration signal.
      - alert: KhanaBookPaymentWebhookHashMismatch
        expr: |
          sum(rate(payments_webhook_dropped_total{reason="hash_mismatch"}[30m])) > 0.05
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Sustained Easebuzz webhook hash mismatches"
          description: >-
            More than 0.05 rejected signature/sec for an hour. Check the Easebuzz
            salt/key configuration first; if it is correct, check for spoofed
            traffic against /payments/easebuzz/webhook.

      # already_paid is a healthy idempotent no-op (bill settled by manual verify
      # or a different txnid, then the webhook replays). It is recorded for
      # observability, never as an incident — alerting on it produced false
      # criticals for ordinary replay traffic.
      - alert: KhanaBookPaymentWebhookReplayVolume
        expr: |
          sum(rate(payments_webhook_dropped_total{reason="already_paid"}[30m])) > 1
        for: 2h
        labels:
          severity: info
        annotations:
          summary: "High volume of already-paid webhook replays"
          description: >-
            Over 1 replay/sec for two hours. Usually harmless, but a sustained rate
            suggests a merchant is retrying a stale transaction id or the gateway
            is re-delivering after a settlement mismatch — worth a look, not a page.

      # No webhook at all. Silence is indistinguishable from a quiet evening
      # unless it is measured — a busy restaurant settling nothing for an hour
      # is a broken integration, not a slow day.
      - alert: KhanaBookWebhookSilence
        expr: |
          payments_webhook_silence_seconds > 3600
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "No Easebuzz webhook for over an hour"
          description: >-
            payments_webhook_silence_seconds is {{ $value }}s. Check the Easebuzz
            dashboard webhook configuration and nginx access to /api/payments/webhook.
